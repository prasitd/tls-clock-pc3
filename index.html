<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Wall Clock (OK-4822 Style)</title>
    <!-- โหลดฟอนต์ตัวเลขดิจิทัล 7-Segment -->
    <link href="https://fonts.cdnfonts.com/css/vt323" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Roboto:wght@700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Roboto', sans-serif;
        }

        /* ตัวเรือนนาฬิกาหลัก (กรอบดำขอบกระจกเงา) */
        .clock-body {
            width: 780px;
            height: 420px;
            background: #000000;
            border: 4px solid #222;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9),
                        inset 0 0 10px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* --- ส่วนเวลาหลัก (ชั่วโมง : นาที : วินาที) --- */
        .time-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 240px;
            gap: 12px;
        }

        .time-box {
            background: #111417;
            flex: 1;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .time-digit {
            font-family: 'Orbitron', monospace;
            font-size: 110px;
            font-weight: 900;
            color: #00aeff;
            text-shadow: 0 0 12px rgba(0, 174, 255, 0.7),
                         0 0 25px rgba(0, 174, 255, 0.4);
            letter-spacing: 2px;
        }

        .colon-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 30px;
        }

        .colon-dot {
            width: 14px;
            height: 14px;
            background-color: #00aeff;
            border-radius: 50%;
            box-shadow: 0 0 10px #00aeff, 0 0 20px #00aeff;
        }

        /* --- ส่วนแถบด้านล่าง (วันที่, เดือน, ปี, วันในสัปดาห์) --- */
        .bottom-container {
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            gap: 20px;
            height: 110px;
        }

        .date-section {
            display: flex;
            gap: 12px;
        }

        .date-field {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .date-box {
            background: #111417;
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 12px;
            border-radius: 4px;
            min-width: 65px;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
        }

        .date-box.year {
            min-width: 110px;
        }

        .date-digit {
            font-family: 'Orbitron', monospace;
            font-size: 38px;
            font-weight: 700;
            color: #00aeff;
            text-shadow: 0 0 8px rgba(0, 174, 255, 0.6);
        }

        .label {
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            margin-top: 8px;
            letter-spacing: 1px;
        }

        /* ส่วนแสดงวัน SUN MON TUE WED THU FRI SAT */
        .days-container {
            display: flex;
            gap: 14px;
            margin-left: 20px;
            margin-bottom: 35px;
        }

        .day {
            font-size: 17px;
            font-weight: 700;
            color: #222d38; /* วันปกติที่ไม่ได้เปิดไฟ */
            letter-spacing: 1px;
        }

        .day.active {
            color: #00aeff; /* วันปัจจุบัน สว่างขึ้นมา */
            text-shadow: 0 0 10px rgba(0, 174, 255, 0.8);
        }

        /* โลโก้รุ่นตรงมุมขวา */
        .model-number {
            position: absolute;
            bottom: 12px;
            right: 20px;
            color: #555;
            font-size: 11px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="clock-body">
        <!-- แสดงเวลาหลัก -->
        <div class="time-container">
            <div class="time-box"><span class="time-digit" id="hours">10</span></div>
            <div class="colon-box">
                <div class="colon-dot"></div>
                <div class="colon-dot"></div>
            </div>
            <div class="time-box"><span class="time-digit" id="minutes">58</span></div>
            <div class="colon-box">
                <div class="colon-dot"></div>
                <div class="colon-dot"></div>
            </div>
            <div class="time-box"><span class="time-digit" id="seconds">30</span></div>
        </div>

        <!-- แสดงวันที่ และ วันในสัปดาห์ -->
        <div class="bottom-container">
            <div class="date-section">
                <!-- DATE -->
                <div class="date-field">
                    <div class="date-box"><span class="date-digit" id="date">9</span></div>
                    <span class="label">DATE</span>
                </div>
                <!-- MONTH -->
                <div class="date-field">
                    <div class="date-box"><span class="date-digit" id="month">10</span></div>
                    <span class="label">MONTH</span>
                </div>
                <!-- YEAR -->
                <div class="date-field">
                    <div class="date-box year"><span class="date-digit" id="year">2024</span></div>
                    <span class="label">YEAR</span>
                </div>
            </div>

            <!-- รายชื่อวัน SUN - SAT -->
            <div class="days-container">
                <span class="day" id="day-0">SUN</span>
                <span class="day" id="day-1">MON</span>
                <span class="day" id="day-2">TUE</span>
                <span class="day" id="day-3">WED</span>
                <span class="day" id="day-4">THU</span>
                <span class="day" id="day-5">FRI</span>
                <span class="day" id="day-6">SAT</span>
            </div>
        </div>

        <div class="model-number">OK-4822</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();

            // ดึงค่า เวลา
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('hours').innerText = hours;
            document.getElementById('minutes').innerText = minutes;
            document.getElementById('seconds').innerText = seconds;

            // ดึงค่า วัน เดือน ปี
            const date = now.getDate();
            const month = now.getMonth() + 1; // เดือนเริ่มนับจาก 0
            const year = now.getFullYear();

            document.getElementById('date').innerText = date;
            document.getElementById('month').innerText = month;
            document.getElementById('year').innerText = year;

            // เปิดไฟเฉพาะวันปัจจุบัน (SUN = 0, MON = 1, ...)
            const currentDay = now.getDay();
            for (let i = 0; i < 7; i++) {
                const dayElement = document.getElementById(`day-${i}`);
                if (i === currentDay) {
                    dayElement.classList.add('active');
                } else {
                    dayElement.classList.remove('active');
                }
            }
        }

        // อัปเดตเวลาทุกๆ 1 วินาที
        setInterval(updateClock, 1000);
        updateClock();
    </script>

</body>
</html>
