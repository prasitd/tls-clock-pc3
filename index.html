<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Wall Clock (OK-4822 Style)</title>
    <!-- ฟอนต์ตัวเลขดิจิทัล 7-Segment และ Orbitron -->
    <link href="https://fonts.cdnfonts.com/css/digital-7-mono" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto:wght@700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Roboto', sans-serif;
        }

        /* ตัวเรือนนาฬิกา - ทรงสี่เหลี่ยมผืนผ้าแนวนอน ขอบชิด */
        .clock-body {
            width: 820px;
            height: 380px;
            background: #020202;
            border: 4px solid #1a1a1a;
            border-radius: 12px;
            padding: 16px 20px 14px 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.95),
                        inset 0 0 10px rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* --- แถบแสดงเวลาหลัก --- */
        .time-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 245px;
            gap: 10px;
        }

        .time-box {
            background: #101418;
            flex: 1;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.9);
            overflow: hidden;
        }

        .time-digit {
            font-family: 'Digital-7 Mono', 'Orbitron', monospace;
            font-size: 160px;
            font-weight: 900;
            color: #00b4ff;
            text-shadow: 0 0 14px rgba(0, 180, 255, 0.85),
                         0 0 30px rgba(0, 180, 255, 0.5);
            letter-spacing: 2px;
            line-height: 1;
            transform: skewX(-6deg); /* เอียงตัวเลขให้เหมือนหน้าปัด LED ของจริง */
            display: inline-block;
        }

        /* จุดโคลอนกระพริบ */
        .colon-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 34px;
            padding: 0 2px;
        }

        .colon-dot {
            width: 14px;
            height: 14px;
            background-color: #00b4ff;
            border-radius: 2px;
            box-shadow: 0 0 10px #00b4ff, 0 0 20px #00b4ff;
        }

        /* --- แถบด้านล่าง (วันที่ + วันในสัปดาห์) --- */
        .bottom-container {
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            gap: 28px;
            height: 90px;
        }

        .date-section {
            display: flex;
            gap: 8px;
        }

        .date-field {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .date-box {
            background: #101418;
            height: 62px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 10px;
            border-radius: 4px;
            min-width: 62px;
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.9);
        }

        .date-box.year {
            min-width: 125px;
        }

        .date-digit {
            font-family: 'Digital-7 Mono', 'Orbitron', monospace;
            font-size: 44px;
            font-weight: 700;
            color: #00b4ff;
            text-shadow: 0 0 10px rgba(0, 180, 255, 0.7);
            transform: skewX(-5deg);
            display: inline-block;
        }

        .label {
            color: #d1d5db;
            font-size: 13px;
            font-weight: 800;
            margin-top: 5px;
            letter-spacing: 1px;
            font-family: 'Roboto', sans-serif;
        }

        /* รายชื่อวันในสัปดาห์ SUN - SAT */
        .days-container {
            display: flex;
            align-items: center;
            gap: 16px;
            height: 62px;
        }

        .day {
            font-size: 16px;
            font-weight: 800;
            color: #1a232b; /* สียังไม่เปิดไฟ */
            letter-spacing: 1px;
        }

        .day.active {
            color: #00b4ff; /* สีวันปัจจุบัน */
            text-shadow: 0 0 10px rgba(0, 180, 255, 0.9),
                         0 0 20px rgba(0, 180, 255, 0.5);
        }

        /* โค้ดรุ่นมุมขวาล่าง */
        .model-number {
            position: absolute;
            bottom: 8px;
            right: 16px;
            color: #444;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="clock-body">
        <!-- แสดงเวลาหลัก -->
        <div class="time-container">
            <div class="time-box"><span class="time-digit" id="hours">10</span></div>
            <div class="colon-box">
                <div class="colon-dot"></div>
                <div class="colon-dot"></div>
            </div>
            <div class="time-box"><span class="time-digit" id="minutes">58</span></div>
            <div class="colon-box">
                <div class="colon-dot"></div>
                <div class="colon-dot"></div>
            </div>
            <div class="time-box"><span class="time-digit" id="seconds">30</span></div>
        </div>

        <!-- แถบวันที่และสัปดาห์ -->
        <div class="bottom-container">
            <div class="date-section">
                <!-- DATE -->
                <div class="date-field">
                    <div class="date-box"><span class="date-digit" id="date">9</span></div>
                    <span class="label">DATE</span>
                </div>
                <!-- MONTH -->
                <div class="date-field">
                    <div class="date-box"><span class="date-digit" id="month">10</span></div>
                    <span class="label">MONTH</span>
                </div>
                <!-- YEAR -->
                <div class="date-field">
                    <div class="date-box year"><span class="date-digit" id="year">2024</span></div>
                    <span class="label">YEAR</span>
                </div>
            </div>

            <!-- SUN - SAT -->
            <div class="days-container">
                <span class="day" id="day-0">SUN</span>
                <span class="day" id="day-1">MON</span>
                <span class="day" id="day-2">TUE</span>
                <span class="day" id="day-3">WED</span>
                <span class="day" id="day-4">THU</span>
                <span class="day" id="day-5">FRI</span>
                <span class="day" id="day-6">SAT</span>
            </div>
        </div>

        <div class="model-number">OK-4822</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('hours').innerText = hours;
            document.getElementById('minutes').innerText = minutes;
            document.getElementById('seconds').innerText = seconds;

            const date = now.getDate();
            const month = now.getMonth() + 1;
            const year = now.getFullYear();

            document.getElementById('date').innerText = date;
            document.getElementById('month').innerText = month;
            document.getElementById('year').innerText = year;

            const currentDay = now.getDay();
            for (let i = 0; i < 7; i++) {
                const dayElement = document.getElementById(`day-${i}`);
                if (i === currentDay) {
                    dayElement.classList.add('active');
                } else {
                    dayElement.classList.remove('active');
                }
            }
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>

</body>
</html>
